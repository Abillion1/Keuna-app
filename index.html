<!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, updateDoc, deleteDoc, doc, onSnapshot, query, where, writeBatch } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCw03833WSjiI-lyH5dw6XQ_HCmqd4PH5E",
            authDomain: "laporan-keuangan-e2a6a.firebaseapp.com",
            projectId: "laporan-keuangan-e2a6a",
            storageBucket: "laporan-keuangan-e2a6a.firebasestorage.app",
            messagingSenderId: "1075044450129",
            appId: "1:1075044450129:web:e64213d4fe7eaa83a69d70"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;
        let unsubscribe = null;
        let currentMonth = new Date().getMonth();
        let currentYear = new Date().getFullYear(); 
        let allTransactions = [];
        let chartInstance = null;
        let yearlyChartInstance = null;
        let monthlyTrendChartInstance = null;

        let currentPage = 1;
        const rowsPerPage = 10;

        let selectedCurrency = 'IDR';
        const currencyRates = { IDR: 1, USD: 0.000064, EUR: 0.000059 };

        let monthlyBudget = localStorage.getItem('monthlyBudget') ? parseFloat(localStorage.getItem('monthlyBudget')) : 3000000;

        const monthNames = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
        const ALL_CATEGORIES = ['Pendapatan', 'Rumah dan keluarga', 'Jajanan', 'Bahan Bakar', 'Tagihan / Ewallet', 'Kebutuhan', 'Investasi', 'Perkopian Duniawi', 'Tarik Tunai', 'Lain-lain'];

        const CATEGORY_COLORS = {
            'Pendapatan': { hex: '#10b981' }, 'Rumah dan keluarga': { hex: '#f97316' }, 'Jajanan': { hex: '#ec4899' },
            'Bahan Bakar': { hex: '#f59e0b' }, 'Tagihan / Ewallet': { hex: '#06b6d4' }, 'Kebutuhan': { hex: '#14b8a6' },
            'Investasi': { hex: '#6366f1' }, 'Perkopian Duniawi': { hex: '#3b82f6' }, 'Tarik Tunai': { hex: '#a855f7' },
            'Lain-lain': { hex: '#64748b' }
        };

        function cleanCategoryName(rawCat) {
            if (!rawCat) return 'Lain-lain';
            return rawCat.replace(/^\d+\.\s*/, '').trim();
        }

        function formatDateYYYYMMDD(dateStr) {
            if (!dateStr) return '';
            const parts = dateStr.split('-');
            if (parts.length !== 3) return dateStr;
            if (parts[0].length === 4) return `${parts[0]}-${parts[1]}-${parts[2]}`;
            return `${parts[2]}-${parts[1]}-${parts[0]}`;
        }

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            populateYearOptions(2025, 2080);
            initCategoryFilterDropdown();
            initChart();
            initYearlyChart();
            initMonthlyTrendChart();
            
            document.getElementById('monthSelect').value = currentMonth;
            document.getElementById('yearSelect').value = currentYear;
            document.getElementById('formDate').value = new Date().toISOString().split('T')[0];
            document.getElementById('budgetInput').value = monthlyBudget;

            document.getElementById('btnDarkMode').addEventListener('click', () => {
                document.documentElement.classList.toggle('dark');
            });

            document.getElementById('currencySelect').addEventListener('change', (e) => {
                selectedCurrency = e.target.value;
                renderApp();
                renderYearlySummary();
            });

            document.getElementById('btnSaveBudget').addEventListener('click', () => {
                const val = parseFloat(document.getElementById('budgetInput').value);
                if (!isNaN(val) && val >= 0) {
                    monthlyBudget = val;
                    localStorage.setItem('monthlyBudget', val);
                    renderApp();
                }
            });

            document.getElementById('btnLogin').addEventListener('click', loginGoogle);
            document.getElementById('btnLogout').addEventListener('click', logoutGoogle);
            document.getElementById('btnOpenModal').addEventListener('click', () => openModal());
            document.getElementById('btnFab').addEventListener('click', () => openModal());
            document.getElementById('btnCloseModalHeader').addEventListener('click', closeModal);
            document.getElementById('btnCancelModal').addEventListener('click', closeModal);
            document.getElementById('btnPdf').addEventListener('click', downloadPDF);
            document.getElementById('txForm').addEventListener('submit', saveBatchTransactions);
            document.getElementById('btnAddRow').addEventListener('click', () => appendRowToModal());

            document.getElementById('btnPrevPage').addEventListener('click', () => {
                if (currentPage > 1) { currentPage--; renderApp(); }
            });
            document.getElementById('btnNextPage').addEventListener('click', () => {
                currentPage++; renderApp();
            });

            document.getElementById('prevMonth').addEventListener('click', () => {
                if (currentMonth === 0) { currentMonth = 11; currentYear--; } else { currentMonth--; }
                updateDropdownValues(); renderApp();
            });

            document.getElementById('nextMonth').addEventListener('click', () => {
                if (currentMonth === 11) { currentMonth = 0; currentYear++; } else { currentMonth++; }
                updateDropdownValues(); renderApp();
            });

            document.getElementById('tabMonthlyBtn').addEventListener('click', () => switchTab('monthly'));
            document.getElementById('tabYearlyBtn').addEventListener('click', () => switchTab('yearly'));

            document.querySelectorAll('input[name="type"]').forEach(radio => {
                radio.addEventListener('change', handleTypeChange);
            });

            onAuthStateChanged(auth, (user) => {
                if (user) {
                    currentUser = user;
                    document.getElementById('loginScreen').classList.add('hidden');
                    document.getElementById('appContent').classList.remove('hidden');
                    document.getElementById('userPhoto').src = user.photoURL || 'https://via.placeholder.com/150';
                    loadUserData();
                } else {
                    currentUser = null;
                    document.getElementById('loginScreen').classList.remove('hidden');
                    document.getElementById('appContent').classList.add('hidden');
                    if (unsubscribe) unsubscribe();
                }
            });
        });

        function createRowHTML(category = '', title = '', amount = '') {
            return `
            <div class="tx-row flex flex-wrap sm:flex-nowrap items-center gap-2 bg-slate-50 dark:bg-slate-800/40 p-2.5 rounded-xl border border-slate-200 dark:border-slate-700/80 transition">
                <div class="w-full sm:w-1/3">
                    <select class="row-category w-full clean-select bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg px-2.5 py-1.5 text-xs font-semibold text-slate-800 dark:text-slate-200 focus:outline-none focus:border-brand-500" required></select>
                </div>
                <div class="w-full sm:w-1/2">
                    <input type="text" class="row-title w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-800 dark:text-slate-200 focus:outline-none focus:border-brand-500" placeholder="Keterangan pengeluaran" value="${title}" required>
                </div>
                <div class="w-full sm:w-1/3 flex items-center gap-1.5">
                    <input type="number" class="row-amount w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg px-2.5 py-1.5 text-xs font-semibold text-slate-800 dark:text-slate-200 focus:outline-none focus:border-brand-500" placeholder="Jumlah (Rp)" min="1" value="${amount}" required>
                    <button type="button" class="btn-remove-row text-slate-400 hover:text-rose-500 p-1.5 rounded-lg transition" title="Hapus Baris">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>
            `;
        }

        function populateRowCategories(rowElement) {
            const type = document.querySelector('input[name="type"]:checked').value;
            const select = rowElement.querySelector('.row-category');
            select.innerHTML = '';

            if (type === 'TRANSFER') {
                select.innerHTML = `<option value="Tarik Tunai">Tarik Tunai</option>`;
                rowElement.querySelector('.row-title').value = 'Tarik Tunai dari Bank ke Cash';
            } else {
                const categories = type === 'INCOME' ? ['Pendapatan'] : ['Kebutuhan', 'Jajanan', 'Rumah dan keluarga', 'Bahan Bakar', 'Tagihan / Ewallet', 'Investasi', 'Perkopian Duniawi', 'Lain-lain'];
                categories.forEach(cat => {
                    const opt = document.createElement('option');
                    opt.value = cat;
                    opt.innerText = cat;
                    select.appendChild(opt);
                });
            }
        }

        function updateDropdownValues() {
            document.getElementById('monthSelect').value = currentMonth;
            document.getElementById('yearSelect').value = currentYear;
        }

        function populateYearOptions(startYear, endYear) {
            const yearSelect = document.getElementById('yearSelect');
            yearSelect.innerHTML = '';
            for (let yr = startYear; yr <= endYear; yr++) {
                const opt = document.createElement('option');
                opt.value = yr; opt.innerText = yr;
                yearSelect.appendChild(opt);
            }
        }

        function initCategoryFilterDropdown() {
            const filterCategory = document.getElementById('categoryFilter');
            filterCategory.innerHTML = `<option value="ALL">Semua Kategori</option>`;
            ALL_CATEGORIES.forEach(cat => {
                if (cat !== 'Tarik Tunai') filterCategory.innerHTML += `<option value="${cat}">${cat}</option>`;
            });
        }

        function switchTab(tab) {
            const monthlyBtn = document.getElementById('tabMonthlyBtn');
            const yearlyBtn = document.getElementById('tabYearlyBtn');
            const monthlyView = document.getElementById('tabMonthlyView');
            const yearlyView = document.getElementById('tabYearlyView');

            if (tab === 'monthly') {
                monthlyBtn.className = "px-3 py-1 rounded-md text-xs font-medium bg-white dark:bg-slate-700 text-slate-900 dark:text-white shadow-sm border border-slate-200 dark:border-slate-600";
                yearlyBtn.className = "px-3 py-1 rounded-md text-xs font-medium text-slate-500 hover:text-slate-900 dark:hover:text-white transition";
                yearlyView.classList.add('hidden');
                monthlyView.classList.remove('hidden');
            } else {
                yearlyBtn.className = "px-3 py-1 rounded-md text-xs font-medium bg-white dark:bg-slate-700 text-slate-900 dark:text-white shadow-sm border border-slate-200 dark:border-slate-600";
                monthlyBtn.className = "px-3 py-1 rounded-md text-xs font-medium text-slate-500 hover:text-slate-900 dark:hover:text-white transition";
                monthlyView.classList.add('hidden');
                yearlyView.classList.remove('hidden');
                renderYearlySummary();
            }
        }

        function loadUserData() {
            if (!currentUser) return;
            const txCollection = collection(db, "transactions");
            const q = query(txCollection, where("uid", "==", currentUser.uid));
            
            unsubscribe = onSnapshot(q, (snapshot) => {
                allTransactions = snapshot.docs.map(doc => ({
                    id: doc.id,
                    ...doc.data()
                })).sort((a, b) => new Date(a.date) - new Date(b.date));
                renderApp();
                renderYearlySummary();
            }, (error) => {
                console.error("Firestore Error: ", error);
            });
        }

        async function loginGoogle() {
            try { await signInWithPopup(auth, provider); } catch (error) { alert("Gagal Login: " + error.message); }
        }

        async function logoutGoogle() {
            if (confirm("Apakah Anda yakin ingin keluar?")) await signOut(auth);
        }

        document.getElementById('monthSelect').addEventListener('change', (e) => { currentMonth = parseInt(e.target.value); renderApp(); });
        document.getElementById('yearSelect').addEventListener('change', (e) => { currentYear = parseInt(e.target.value); renderApp(); renderYearlySummary(); });
        document.getElementById('categoryFilter').addEventListener('change', () => { currentPage = 1; renderApp(); });
        document.getElementById('sourceFilter').addEventListener('change', () => { currentPage = 1; renderApp(); });

        function formatCurrency(amount) {
            const converted = amount * currencyRates[selectedCurrency];
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: selectedCurrency, maximumFractionDigits: 0 }).format(converted);
        }

        function renderApp() {
            const catFilterElement = document.getElementById('categoryFilter');
            const srcFilterElement = document.getElementById('sourceFilter');
            
            const catFilter = (catFilterElement && catFilterElement.value) ? catFilterElement.value : 'ALL';
            const srcFilter = (srcFilterElement && srcFilterElement.value) ? srcFilterElement.value : 'ALL';

            // DIBERSIHKAN & DIPERBAIKI: Pemfilteran berdasarkan string tanggal YYYY-MM-DD
            const monthTx = allTransactions.filter(t => {
                if (!t.date) return false;
                const parts = t.date.split('-');
                if (parts.length < 3) return false;
                const year = parseInt(parts[0], 10);
                const month = parseInt(parts[1], 10) - 1; 
                return month === currentMonth && year === currentYear;
            });

            const filteredTx = monthTx.filter(t => {
                const cleanCat = cleanCategoryName(t.category);
                const matchCategory = (catFilter === 'ALL' || catFilter === '') || (cleanCat === catFilter);
                const matchSource = (srcFilter === 'ALL' || srcFilter === '') || (t.source === srcFilter) || (t.type === 'TRANSFER');
                return matchCategory && matchSource;
            });

            let totalIncome = 0;
            let totalExpense = 0;
            let bankBal = 0;
            let cashBal = 0;

            monthTx.forEach(t => {
                const amt = Number(t.amount) || 0; 
                if (t.type === 'INCOME') {
                    totalIncome += amt;
                    if (t.source === 'BANK') bankBal += amt; else cashBal += amt;
                } else if (t.type === 'EXPENSE') {
                    totalExpense += amt;
                    if (t.source === 'BANK') bankBal -= amt; else cashBal -= amt;
                } else if (t.type === 'TRANSFER') {
                    bankBal -= amt; cashBal += amt;
                }
            });

            document.getElementById('totalIncome').innerText = formatCurrency(totalIncome);
            document.getElementById('totalExpense').innerText = formatCurrency(totalExpense);
            document.getElementById('bankBalance').innerText = formatCurrency(bankBal);
            document.getElementById('cashBalance').innerText = formatCurrency(cashBal);

            const netSavings = totalIncome - totalExpense;
            const netSavingsText = document.getElementById('netSavingsText');
            netSavingsText.innerText = formatCurrency(netSavings);
            
            if (netSavings >= 0) {
                netSavingsText.className = "text-xs font-bold text-emerald-600 dark:text-emerald-400";
                document.getElementById('savingsIcon').className = "w-4 h-4 text-emerald-600 dark:text-emerald-400";
            } else {
                netSavingsText.className = "text-xs font-bold text-rose-600 dark:text-rose-400";
                document.getElementById('savingsIcon').className = "w-4 h-4 text-rose-600 dark:text-rose-400";
            }

            const budgetPercent = monthlyBudget > 0 ? Math.min(100, Math.round((totalExpense / monthlyBudget) * 100)) : 0;
            const progressBar = document.getElementById('budgetProgressBar');
            progressBar.style.width = `${budgetPercent}%`;
            progressBar.className = budgetPercent > 90 ? "bg-rose-500 h-full rounded-full transition-all duration-500" : "bg-emerald-500 h-full rounded-full transition-all duration-500";
            document.getElementById('budgetStatusText').innerText = `Terpakai ${budgetPercent}% dari batas ${formatCurrency(monthlyBudget)}`;

            // RENDER TABEL PEMASUKAN
            const incomeTx = filteredTx.filter(t => t.type === 'INCOME');
            const incomeTbody = document.getElementById('incomeTable');
            if (incomeTbody) {
                incomeTbody.innerHTML = '';
                incomeTx.forEach(t => {
                    const tr = document.createElement('tr');
                    tr.className = 'hover:bg-slate-50 dark:hover:bg-slate-800/40 transition';
                    tr.innerHTML = `
                        <td class="py-2.5 pl-2 text-slate-400">${formatDateYYYYMMDD(t.date || '')}</td>
                        <td class="py-2.5"><span class="text-[10px] font-semibold px-2 py-0.5 rounded bg-emerald-50 dark:bg-emerald-950/60 text-emerald-600 dark:text-emerald-400 border border-emerald-200 dark:border-emerald-800">${t.source || '-'}</span></td>
                        <td class="py-2.5 font-semibold text-slate-700 dark:text-slate-300">${cleanCategoryName(t.category)}</td>
                        <td class="py-2.5 font-medium text-slate-800 dark:text-slate-200">${t.title || '-'}</td>
                        <td class="py-2.5 text-right text-emerald-600 dark:text-emerald-400 font-bold">+ ${formatCurrency(Number(t.amount) || 0)}</td>
                        <td class="py-2.5 pr-2 text-center">
                            <div class="flex items-center justify-center gap-1">
                                <button data-id="${t.id}" class="btn-edit text-slate-400 hover:text-brand-600 p-1 rounded transition"><i data-lucide="pencil" class="w-3.5 h-3.5"></i></button>
                                <button data-id="${t.id}" class="btn-delete text-slate-400 hover:text-rose-600 p-1 rounded transition"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                            </div>
                        </td>
                    `;
                    incomeTbody.appendChild(tr);
                });
            }

            // RENDER TABEL PENGELUARAN & TRANSFER
            const expAndTransTx = filteredTx.filter(t => t.type !== 'INCOME');
            
            const totalPages = Math.max(1, Math.ceil(expAndTransTx.length / rowsPerPage));
            if (currentPage > totalPages) currentPage = totalPages;

            const startIdx = (currentPage - 1) * rowsPerPage;
            const paginatedTx = expAndTransTx.slice(startIdx, startIdx + rowsPerPage);

            const tbody = document.getElementById('transactionTable');
            if (tbody) {
                document.getElementById('txCount').innerText = `${expAndTransTx.length} Transaksi`;
                document.getElementById('pageInfo').innerText = `Halaman ${currentPage} dari ${totalPages}`;
                tbody.innerHTML = '';
                
                paginatedTx.forEach(t => {
                    const tr = document.createElement('tr');
                    tr.className = 'hover:bg-slate-50 dark:hover:bg-slate-800/40 transition';

                    let amountClass = 'text-rose-600 dark:text-rose-400 font-semibold';
                    let sign = '-';
                    let sourceBadge = t.source === 'BANK' ? 
                        '<span class="text-[10px] font-semibold px-2 py-0.5 rounded bg-blue-50 dark:bg-blue-950/60 text-blue-600 dark:text-blue-400 border border-blue-200 dark:border-blue-800">BANK</span>' : 
                        '<span class="text-[10px] font-semibold px-2 py-0.5 rounded bg-amber-50 dark:bg-amber-950/60 text-amber-600 dark:text-amber-400 border border-amber-200 dark:border-amber-800">CASH</span>';

                    if (t.type === 'TRANSFER') {
                        amountClass = 'text-amber-600 dark:text-amber-400 font-semibold';
                        sign = '⇄';
                        sourceBadge = '<span class="text-[10px] font-semibold px-2 py-0.5 rounded bg-purple-50 dark:bg-purple-950/60 text-purple-600 dark:text-purple-400 border border-purple-200 dark:border-purple-800">TARIK TUNAI</span>';
                    }

                    tr.innerHTML = `
                        <td class="py-2.5 pl-2 text-slate-400">${formatDateYYYYMMDD(t.date || '')}</td>
                        <td class="py-2.5">${sourceBadge}</td>
                        <td class="py-2.5"><span class="font-medium text-slate-700 dark:text-slate-300">${cleanCategoryName(t.category)}</span></td>
                        <td class="py-2.5 font-medium text-slate-800 dark:text-slate-200">${t.title || '-'}</td>
                        <td class="py-2.5 text-right ${amountClass}">${sign} ${formatCurrency(Number(t.amount) || 0)}</td>
                        <td class="py-2.5 pr-2 text-center">
                            <div class="flex items-center justify-center gap-1">
                                <button data-id="${t.id}" class="btn-edit text-slate-400 hover:text-brand-600 p-1 rounded transition"><i data-lucide="pencil" class="w-3.5 h-3.5"></i></button>
                                <button data-id="${t.id}" class="btn-delete text-slate-400 hover:text-rose-600 p-1 rounded transition"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                            </div>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            document.querySelectorAll('.btn-edit').forEach(btn => {
                btn.addEventListener('click', (e) => openModal(e.currentTarget.getAttribute('data-id')));
            });

            document.querySelectorAll('.btn-delete').forEach(btn => {
                btn.addEventListener('click', (e) => deleteTransaction(e.currentTarget.getAttribute('data-id')));
            });

            if (typeof lucide !== 'undefined') lucide.createIcons();
            updateChart(monthTx);
        }

        function renderYearlySummary() {
            document.querySelectorAll('.yearlyTitleYear').forEach(el => el.innerText = currentYear);

            const yearExpenses = allTransactions.filter(t => {
                if (t.type !== 'EXPENSE' || !t.date) return false;
                return parseInt(t.date.split('-')[0], 10) === currentYear;
            });
            
            let yearlyTotalExpense = 0;
            const categoryTotals = {};
            const activeMonthsSet = new Set();

            yearExpenses.forEach(t => {
                const amt = Number(t.amount) || 0;
                const catClean = cleanCategoryName(t.category);
                yearlyTotalExpense += amt;
                categoryTotals[catClean] = (categoryTotals[catClean] || 0) + amt;
                if (t.date) activeMonthsSet.add(t.date.substring(0, 7));
            });

            const activeMonthsCount = activeMonthsSet.size || 1;
            const yearlyAvgExpense = yearlyTotalExpense / activeMonthsCount;

            document.getElementById('yearlyTotalExpense').innerText = formatCurrency(yearlyTotalExpense);
            document.getElementById('yearlyAvgExpense').innerText = formatCurrency(yearlyAvgExpense);
            document.getElementById('yearlyBudgetRecommendation').innerText = formatCurrency(yearlyAvgExpense);

            const yearlyTbody = document.getElementById('yearlyCategoryTable');
            yearlyTbody.innerHTML = '';

            const sortedCategories = Object.keys(categoryTotals).sort((a, b) => categoryTotals[b] - categoryTotals[a]);

            sortedCategories.forEach(cat => {
                const total = categoryTotals[cat];
                const percentage = yearlyTotalExpense > 0 ? ((total / yearlyTotalExpense) * 100).toFixed(1) : 0;
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-50 dark:hover:bg-slate-800/40 transition';
                tr.innerHTML = `
                    <td class="py-2.5 pl-2"><span class="font-medium text-slate-700 dark:text-slate-300">${cat}</span></td>
                    <td class="py-2.5 text-right font-semibold text-rose-600 dark:text-rose-400">${formatCurrency(total)}</td>
                    <td class="py-2.5 text-right pr-2 text-slate-400 font-medium">${percentage}%</td>
                `;
                yearlyTbody.appendChild(tr);
            });

            updateYearlyChart(categoryTotals);
            updateMonthlyTrendChart();
        }

        function initChart() {
            const ctx = document.getElementById('expenseChart').getContext('2d');
            chartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: { labels: [], datasets: [{ data: [], backgroundColor: [] }] },
                options: { responsive: true, maintainAspectRatio: false, cutout: '75%' }
            });
        }

        function initYearlyChart() {
            const ctx = document.getElementById('yearlyChart').getContext('2d');
            yearlyChartInstance = new Chart(ctx, {
                type: 'pie',
                data: { labels: [], datasets: [{ data: [], backgroundColor: [] }] },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        function initMonthlyTrendChart() {
            const ctx = document.getElementById('monthlyTrendChart').getContext('2d');
            monthlyTrendChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: monthNames,
                    datasets: [{
                        label: 'Pengeluaran Bulanan',
                        data: Array(12).fill(0),
                        borderColor: '#6366f1',
                        backgroundColor: 'rgba(99, 102, 241, 0.1)',
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        function updateChart(transactions) {
            if (!chartInstance) return;
            
            const expenses = transactions.filter(t => t.type === 'EXPENSE');
            const categorySums = {};
            expenses.forEach(t => {
                const catClean = cleanCategoryName(t.category);
                categorySums[catClean] = (categorySums[catClean] || 0) + (Number(t.amount) || 0);
            });

            const labels = Object.keys(categorySums);
            const data = Object.values(categorySums);
            const bgColors = labels.map(label => CATEGORY_COLORS[label] ? CATEGORY_COLORS[label].hex : '#64748b');

            chartInstance.data.labels = labels;
            chartInstance.data.datasets[0].data = data;
            chartInstance.data.datasets[0].backgroundColor = bgColors;
            chartInstance.update();
        }

        function updateYearlyChart(categoryTotals) {
            const labels = Object.keys(categoryTotals);
            const data = Object.values(categoryTotals);
            const bgColors = labels.map(label => CATEGORY_COLORS[label] ? CATEGORY_COLORS[label].hex : '#64748b');

            yearlyChartInstance.data.labels = labels;
            yearlyChartInstance.data.datasets[0].data = data;
            yearlyChartInstance.data.datasets[0].backgroundColor = bgColors;
            yearlyChartInstance.update();
        }

        function updateMonthlyTrendChart() {
            const monthlySums = Array(12).fill(0);
            allTransactions.forEach(t => {
                if (t.type === 'EXPENSE' && t.date) {
                    const parts = t.date.split('-');
                    if (parseInt(parts[0], 10) === currentYear) {
                        const m = parseInt(parts[1], 10) - 1;
                        monthlySums[m] += Number(t.amount) || 0;
                    }
                }
            });
            monthlyTrendChartInstance.data.datasets[0].data = monthlySums;
            monthlyTrendChartInstance.update();
        }

        function appendRowToModal(category = '', title = '', amount = '') {
            const container = document.getElementById('rowsContainer');
            const div = document.createElement('div');
            div.innerHTML = createRowHTML(category, title, amount);
            const row = div.firstElementChild;
            container.appendChild(row);
            
            populateRowCategories(row);

            row.querySelector('.btn-remove-row').addEventListener('click', () => {
                if (container.querySelectorAll('.tx-row').length > 1) {
                    row.remove();
                    updateRowCountBadge();
                } else {
                    alert("Minimal harus ada 1 item transaksi.");
                }
            });

            updateRowCountBadge();
            lucide.createIcons();
            return row;
        }

        function updateRowCountBadge() {
            const count = document.querySelectorAll('.tx-row').length;
            document.getElementById('rowCountBadge').innerText = `${count} Item`;
        }

        function openModal(editId = null) {
            const modal = document.getElementById('modal');
            const container = document.getElementById('rowsContainer');
            const btnAddRow = document.getElementById('btnAddRow');
            container.innerHTML = '';

            if (editId) {
                document.getElementById('modalTitle').innerText = "Edit Transaksi";
                document.getElementById('editDocId').value = editId;
                btnAddRow.classList.add('hidden');
                
                const tx = allTransactions.find(t => t.id === editId);
                if (tx) {
                    document.querySelector(`input[name="type"][value="${tx.type}"]`).checked = true;
                    document.getElementById('globalSource').value = tx.source || 'BANK';
                    document.getElementById('formDate').value = tx.date;
                    
                    const row = appendRowToModal(tx.category, tx.title, tx.amount);
                    row.querySelector('.row-category').value = cleanCategoryName(tx.category);
                }
            } else {
                document.getElementById('modalTitle').innerText = "Input Transaksi Massal";
                document.getElementById('editDocId').value = "";
                btnAddRow.classList.remove('hidden');
                appendRowToModal();
            }

            modal.classList.remove('hidden');
            handleTypeChange();
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
            document.getElementById('txForm').reset();
            document.getElementById('editDocId').value = "";
            document.getElementById('formDate').value = new Date().toISOString().split('T')[0];
        }

        function handleTypeChange() {
            const type = document.querySelector('input[name="type"]:checked').value;
            const sourceContainer = document.getElementById('sourceContainer');
            if (type === 'TRANSFER') sourceContainer.classList.add('hidden');
            else sourceContainer.classList.remove('hidden');

            document.querySelectorAll('.tx-row').forEach(row => populateRowCategories(row));
        }

        async function saveBatchTransactions(e) {
            e.preventDefault();
            if (!currentUser) return;

            const editId = document.getElementById('editDocId').value;
            const type = document.querySelector('input[name="type"]:checked').value;
            const source = type === 'TRANSFER' ? 'BANK' : document.getElementById('globalSource').value;
            const date = document.getElementById('formDate').value;
            const rows = document.querySelectorAll('.tx-row');

            const btnSave = document.getElementById('btnSaveSubmit');
            const btnSaveText = document.getElementById('btnSaveText');
            btnSave.disabled = true;
            btnSaveText.innerText = "Menyimpan...";

            try {
                if (editId) {
                    const row = rows[0];
                    const category = cleanCategoryName(row.querySelector('.row-category').value);
                    const title = row.querySelector('.row-title').value;
                    const amount = parseFloat(row.querySelector('.row-amount').value);

                    await updateDoc(doc(db, "transactions", editId), {
                        type, source, category, title, amount, date
                    });
                } else {
                    const batch = writeBatch(db);
                    const txCollection = collection(db, "transactions");

                    rows.forEach(row => {
                        const category = cleanCategoryName(row.querySelector('.row-category').value);
                        const title = row.querySelector('.row-title').value;
                        const amount = parseFloat(row.querySelector('.row-amount').value);

                        if (title && !isNaN(amount) && amount > 0) {
                            const newDocRef = doc(txCollection);
                            batch.set(newDocRef, {
                                uid: currentUser.uid,
                                type, source, category, title, amount, date,
                                createdAt: new Date()
                            });
                        }
                    });

                    await batch.commit();
                }

                closeModal();
            } catch (err) {
                alert("Gagal menyimpan transaksi: " + err.message);
            } finally {
                btnSave.disabled = false;
                btnSaveText.innerText = "Simpan Semua Transaksi";
            }
        }

        async function deleteTransaction(id) {
            if (confirm('Apakah Anda yakin ingin menghapus transaksi ini?')) {
                try { await deleteDoc(doc(db, "transactions", id)); } catch (err) { alert("Gagal menghapus: " + err.message); }
            }
        }

        function downloadPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            const monthTx = allTransactions.filter(t => {
                if (!t.date) return false;
                const parts = t.date.split('-');
                return parseInt(parts[1], 10) - 1 === currentMonth && parseInt(parts[0], 10) === currentYear;
            });

            doc.setFontSize(16);
            doc.text(`Laporan Keuangan - ${monthNames[currentMonth]} ${currentYear}`, 14, 15);
            
            const tableData = monthTx.map((t, index) => [
                index + 1,
                formatDateYYYYMMDD(t.date),
                t.type === 'INCOME' ? 'Pemasukan' : (t.type === 'EXPENSE' ? 'Pengeluaran' : 'Tarik Tunai'),
                t.source,
                cleanCategoryName(t.category),
                t.title,
                formatCurrency(Number(t.amount) || 0)
            ]);

            doc.autoTable({
                head: [['No', 'Tanggal', 'Jenis', 'Sumber', 'Kategori', 'Keterangan', 'Jumlah']],
                body: tableData,
                startY: 25,
                theme: 'striped',
                headStyles: { fillColor: [99, 102, 241] }
            });

            doc.save(`Laporan_Keuangan_${monthNames[currentMonth]}_${currentYear}.pdf`);
        }
    </script>
