<!DOCTYPE html>
<html lang="id" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KeuanganBulanan - Firebase Edition</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f5f3ff',
                            100: '#ede9fe',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        .clean-select {
            -webkit-appearance: none;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 0.5rem center;
            background-size: 1rem;
            padding-right: 2rem;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen pb-24 antialiased">

    <!-- Screen 1: Login Gate (Tampil jika belum login di Firebase) -->
    <div id="loginScreen" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-50 dark:bg-slate-950 p-4">
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl max-w-md w-full p-8 shadow-xl text-center space-y-6">
            <div class="inline-flex p-3 bg-brand-50 dark:bg-slate-800 text-brand-600 dark:text-brand-400 rounded-2xl border border-brand-100 dark:border-slate-700 mb-2">
                <i data-lucide="wallet" class="w-8 h-8"></i>
            </div>
            <div>
                <h2 class="text-2xl font-bold text-slate-900 dark:text-white tracking-tight">KeuanganBulanan</h2>
                <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Masuk dengan akun Google via Firebase Auth untuk menyinkronkan data Anda.</p>
            </div>

            <!-- Custom Google Sign-In Button untuk Firebase -->
            <button id="btnGoogleLogin" class="w-full py-2.5 px-4 bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 font-semibold text-sm border border-slate-300 dark:border-slate-700 rounded-xl shadow-sm flex items-center justify-center gap-3 transition">
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                <span>Lanjutkan dengan Google</span>
            </button>
            
            <p class="text-[10px] text-slate-400">Tersinkronisasi otomatis menggunakan Cloud Firestore.</p>
        </div>
    </div>

    <!-- Screen 2: Main Application Content -->
    <div id="appContent" class="hidden">
        <header class="sticky top-0 z-30 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md py-3 px-4 border-b border-slate-200 dark:border-slate-800">
            <div class="max-w-6xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
                <div class="flex items-center space-x-3">
                    <div class="p-2 bg-brand-50 dark:bg-slate-800 text-brand-600 dark:text-brand-400 rounded-lg border border-brand-100 dark:border-slate-700">
                        <i data-lucide="wallet" class="w-5 h-5"></i>
                    </div>
                    <div>
                        <h1 class="text-base font-bold leading-tight text-slate-900 dark:text-white tracking-tight">KeuanganBulanan</h1>
                        <p class="text-[11px] text-slate-500 dark:text-slate-400">Firebase Synchronized</p>
                    </div>
                </div>

                <div class="flex items-center gap-2.5">
                    <div id="userProfile" class="flex items-center gap-2 pr-2 border-r border-slate-200 dark:border-slate-700">
                        <img id="userAvatar" src="" class="w-7 h-7 rounded-full border border-slate-200 dark:border-slate-700" alt="Avatar">
                        <span id="userName" class="text-xs font-semibold hidden md:inline text-slate-700 dark:text-slate-200"></span>
                        <button id="btnLogout" class="p-1.5 text-slate-400 hover:text-rose-500 rounded-lg transition" title="Keluar">
                            <i data-lucide="log-out" class="w-4 h-4"></i>
                        </button>
                    </div>

                    <button id="btnDarkMode" class="p-2 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 rounded-lg border border-slate-200 dark:border-slate-700">
                        <i data-lucide="moon" class="w-4 h-4 dark:hidden"></i>
                        <i data-lucide="sun" class="w-4 h-4 hidden dark:block"></i>
                    </button>
                </div>
            </div>
        </header>

        <main class="max-w-6xl mx-auto px-4 mt-6">
            <div class="bg-white dark:bg-slate-900 p-6 rounded-xl border border-slate-200 dark:border-slate-800">
                <h3 class="font-bold text-lg mb-2">Selamat Datang di Dashboard Firebase!</h3>
                <p class="text-xs text-slate-500">Akun Anda berhasil terautentikasi melalui Firebase Auth.</p>
            </div>
        </main>
    </div>

    <!-- Firebase SDK (v10 Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            GoogleAuthProvider, 
            signInWithPopup, 
            signOut, 
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            addDoc, 
            query, 
            where, 
            onSnapshot 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 1. Konfigurasi Firebase Proyek Anda
        const firebaseConfig = {
            apiKey: "YOUR_FIREBASE_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        // UI Element Selectors
        const loginScreen = document.getElementById('loginScreen');
        const appContent = document.getElementById('appContent');
        const btnGoogleLogin = document.getElementById('btnGoogleLogin');
        const btnLogout = document.getElementById('btnLogout');
        const userName = document.getElementById('userName');
        const userAvatar = document.getElementById('userAvatar');

        // 2. Fungsi Login Google dengan Popup Firebase
        btnGoogleLogin.addEventListener('click', async () => {
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                console.error("Gagal Login Firebase:", error.message);
                alert("Gagal melakukan login: " + error.message);
            }
        });

        // 3. Fungsi Logout Firebase
        btnLogout.addEventListener('click', async () => {
            try {
                await signOut(auth);
            } catch (error) {
                console.error("Gagal Logout:", error);
            }
        });

        // 4. Observer Status Autentikasi (Realtime State)
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // User sudah login
                loginScreen.classList.add('hidden');
                appContent.classList.remove('hidden');
                userName.innerText = user.displayName;
                userAvatar.src = user.photoURL || 'https://via.placeholder.com/40';

                // Contoh: Memuat data Firestore milik user yang login
                loadUserData(user.uid);
            } else {
                // User belum login / logout
                loginScreen.classList.remove('hidden');
                appContent.classList.add('hidden');
            }
        });

        // Contoh membaca data khusus User dari Cloud Firestore
        function loadUserData(userId) {
            const q = query(collection(db, "transactions"), where("userId", "==", userId));
            onSnapshot(q, (snapshot) => {
                const userTransactions = [];
                snapshot.forEach((doc) => {
                    userTransactions.push({ id: doc.id, ...doc.data() });
                });
                console.log("Data transaksi Firestore user:", userTransactions);
            });
        }

        // Toggle Dark Mode
        document.getElementById('btnDarkMode').addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
        });

        lucide.createIcons();
    </script>
</body>
</html>
